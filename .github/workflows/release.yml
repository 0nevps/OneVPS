name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify version tag
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Expected a stable version tag, got: %s\n' "$TAG" >&2
            exit 1
          fi
          sha=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          printf 'tag=%s\nsha=%s\n' "$TAG" "$sha" >> "$GITHUB_OUTPUT"

  validate:
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  publish:
    name: Publish release assets
    needs: [resolve, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Publish verified script and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          sha256sum onevps.sh > SHA256SUMS
          sha256sum --check SHA256SUMS

          # Listing releases distinguishes a missing release from an API failure.
          releases=$(gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100")
          existing=$(jq --arg tag "$TAG" '[.[][] | select(.tag_name == $tag)][0] // empty' <<< "$releases")
          if [[ -n "$existing" ]]; then
            if [[ $(jq -r '.draft' <<< "$existing") == true ]]; then
              printf 'Release %s is a draft; inspect it before retrying.\n' "$TAG" >&2
              exit 1
            fi
            work=$(mktemp -d)
            trap 'rm -rf "$work"' EXIT
            gh release download "$TAG" --pattern onevps.sh --pattern SHA256SUMS --dir "$work"
            cmp onevps.sh "$work/onevps.sh"
            cmp SHA256SUMS "$work/SHA256SUMS"
            printf 'Release %s already has identical assets.\n' "$TAG"
            exit 0
          fi

          # Do not let a historical backfill replace a newer Latest release.
          latest=$(jq -r '[.[][] | select(.draft == false and .prerelease == false) | .tag_name
            | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))] | .[]' <<< "$releases")
          newest=$(printf '%s\n%s\n' "$latest" "$TAG" | sort -V | tail -n 1)
          make_latest=false
          if [[ "$newest" == "$TAG" ]]; then
            make_latest=true
          fi

          gh release create "$TAG" onevps.sh SHA256SUMS \
            --verify-tag --target "$SHA" --title "OneVPS $TAG" --generate-notes --draft
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          gh release download "$TAG" --pattern onevps.sh --pattern SHA256SUMS --dir "$work"
          cmp onevps.sh "$work/onevps.sh"
          cmp SHA256SUMS "$work/SHA256SUMS"
          gh release edit "$TAG" --draft=false --latest="$make_latest"
