name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to validate for a release
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}-${{ inputs.ref || 'event' }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate shell and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}

      - name: Validate Bash syntax
        run: bash -n onevps.sh tests/test_onevps.sh tests/test_singbox.sh

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes jq openssl shellcheck python3

      - name: Run ShellCheck
        run: shellcheck --severity=warning onevps.sh tests/test_onevps.sh tests/test_singbox.sh

      - name: Test configuration generation
        run: bash tests/test_onevps.sh

      - name: Validate configuration and forwarding with sing-box 1.14.3
        run: |
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          curl --fail --location --retry 3 \
            https://github.com/SagerNet/sing-box/releases/download/v1.14.3/sing-box-1.14.3-linux-amd64.tar.gz \
            -o "$work/sing-box.tar.gz"
          printf '%s  %s\n' \
            e2bdf179c15a3652955dc44867e33ca0965c9c9b91b34267dcc5a5d639a5feee \
            "$work/sing-box.tar.gz" | sha256sum --check -
          mkdir "$work/core"
          tar -xzf "$work/sing-box.tar.gz" -C "$work/core"
          SINGBOX_TEST_BIN="$work/core/sing-box-1.14.3-linux-amd64/sing-box" bash tests/test_singbox.sh

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.23.2 "**/*.md"
