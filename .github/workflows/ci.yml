name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to validate for a release
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}-${{ inputs.ref || 'event' }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate shell and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}

      - name: Validate Bash syntax
        run: bash -n onevps.sh tests/test_onevps.sh tests/test_xray_outbounds.sh tests/test_hysteria2.sh tests/test_acme.sh

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes jq openssl shellcheck

      - name: Run ShellCheck
        run: shellcheck --severity=warning onevps.sh tests/test_onevps.sh tests/test_xray_outbounds.sh tests/test_hysteria2.sh tests/test_acme.sh

      - name: Test configuration generation
        run: |
          bash tests/test_onevps.sh
          bash tests/test_hysteria2.sh
          bash tests/test_acme.sh

      - name: Validate outbounds with Xray 26.3.27
        run: |
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          curl --fail --location --retry 3 \
            https://github.com/XTLS/Xray-core/releases/download/v26.3.27/Xray-linux-64.zip \
            -o "$work/xray.zip"
          printf '%s  %s\n' \
            23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae \
            "$work/xray.zip" | sha256sum --check -
          unzip -q "$work/xray.zip" -d "$work/core"
          XRAY_TEST_BIN="$work/core/xray" bash tests/test_xray_outbounds.sh

      - name: Test native Hysteria2 with Xray 26.10.21
        run: |
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          curl --fail --location --retry 3 \
            https://github.com/XTLS/Xray-core/releases/download/v26.10.21/Xray-linux-64.zip \
            -o "$work/xray.zip"
          printf '%s  %s\n' \
            0eec3ed4163c273d8c8bf821f7d219e257921cf584aa3fb970715e458e631978 \
            "$work/xray.zip" | sha256sum --check -
          unzip -q "$work/xray.zip" -d "$work/core"
          XRAY_TEST_BIN="$work/core/xray" bash tests/test_hysteria2.sh

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.23.2 "**/*.md"
