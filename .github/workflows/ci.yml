name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate shell and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Bash syntax
        run: bash -n onevps.sh tests/test_onevps.sh

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes jq openssl shellcheck

      - name: Run ShellCheck
        run: shellcheck --severity=warning onevps.sh tests/test_onevps.sh

      - name: Test configuration generation
        run: bash tests/test_onevps.sh

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.23.2 "**/*.md"
