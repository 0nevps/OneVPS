name: Bug report
description: Report a reproducible OneVPS defect or compatibility problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Remove node URLs, UUIDs, passwords,
        private keys, WebSocket paths, tokens, and identifying server data.
        Security vulnerabilities belong in Private Vulnerability Reporting.
        main is an in-progress sing-box v1.14.3 fresh-install rewrite, not a
        migration or dual-core mode. Older releases may still use Xray.

  - type: input
    id: revision
    attributes:
      label: OneVPS revision
      description: Provide the commit SHA, release tag, or script download date.
      placeholder: v0.1.0 or fb9c0b5
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Operating system
      description: Include the distribution, release, and package manager.
      placeholder: Debian 13, apt
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - amd64
        - arm64
        - armv7
        - Other or unknown
    validations:
      required: true

  - type: input
    id: component_versions
    attributes:
      label: Component versions
      description: Include sing-box, systemd, Caddy and Realm versions when relevant.
      placeholder: sing-box 1.14.3; systemd 257; Caddy 2.x

  - type: textarea
    id: installation_state
    attributes:
      label: Installation and conflict state
      description: Describe fresh installation or existing services/configuration; redact secrets.
      placeholder: Fresh host; or operation stopped because an old service/configuration was detected.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: List the smallest sequence that reproduces the problem.
      placeholder: |
        1. Start OneVPS.
        2. Select menu option ...
        3. Enter sanitized value ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: |
        Paste only sanitized output needed to diagnose the problem, such as
        onevps-sing-box version, check output, or journalctl -u onevps-sing-box.service.
        State whether real client traffic was tested; check success alone is not connectivity proof.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed credentials and identifying infrastructure data.
          required: true
        - label: This report is not a security vulnerability.
          required: true
